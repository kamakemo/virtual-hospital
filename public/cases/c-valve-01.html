/* ============================================================
   Severe Aortic Stenosis — TAVI or SAVR?
   An interactive hospital episode. You are the morning resident.
   Guidelines: 2025 ESC/EACTS valvular heart disease; 2020 ACC/AHA
   VHD; 2021 ESC cardiac pacing; 2024 ESC AF and CCS.
   Trial figures are rounded from the primary publications.
   ============================================================ */
const CAST={
 you:['You','Resident · day shift','#C8FF3D','YOU'],
 omar:['Dr Omar Fathy','Resident · night shift','#7FB4FF','OF'],
 layla:['Dr Layla Haddad','Consultant cardiologist','#FF5A4E','LH'],
 karim:['Mr Karim Adel','Cardiac surgeon','#FFC24B','KA'],
 selim:['Dr Selim Nassar','Structural interventionalist','#A678FF','SN'],
 mariam:['Mariam','Charge nurse','#2EE6A6','MN'],
 hassan:['Mr Hassan','The patient','#D7DCE8','HE'],
 dina:['Dina','His daughter','#F5A8C8','DE'],
 ed:['Dr Tarek','ED registrar','#9AA3B8','TR'],
 anaes:['Dr Rania','Cardiac anaesthetist','#7FE0E6','RA']
};
const T=[
/* ---------------- 1 · ER ---------------- */
{id:'er',nav:'🚨 ER',clock:'Day 0 · 23:41',mon:{hr:88,bp:'108/84',spo2:95,rr:20,rhy:'SR'},b:[
 ['slug','Cold open — a wedding hall staircase, 22:50'],
 ['act','He designed half the buildings on this street. Tonight Hassan El-Sayed climbs one flight of stairs carrying a box of candles for his daughter’s wedding rehearsal — and wakes up on the landing with her hands on his face.'],
 ['slug','Emergency department — resus bay 2 — 23:41'],
 ['say','ed','72, witnessed syncope on exertion, out for maybe twenty seconds. No seizure, no tongue biting. Says his chest felt “tight, like a belt” on the stairs. Hypertension, nothing else. BP 108 over 84.'],
 ['say','mariam','Pulse pressure of 24. And he’s pale — I mean properly pale.'],
 ['say','hassan','I’m fine. I stood up too fast. My daughter gets married in five weeks; I don’t have time for this.'],
 ['say','ed','ECG shows LVH with strain and a right bundle. First troponin’s a touch up. I’m going to give him GTN for the chest tightness and call it an NSTEMI work-up.'],
 ['q',{id:'er1',ask:'The ED registrar reaches for the GTN spray. You have thirty seconds. What do you say?',opts:[
  ['“Hold the nitrate. Exertional syncope, narrow pulse pressure, LVH strain — I want a stethoscope on that chest and a probe on it before any vasodilator.”',2,'<b>Exactly.</b> Exertional syncope + slow narrow pulse + LVH strain is aortic stenosis until proven otherwise. A fixed outflow cannot raise output when a nitrate drops preload and afterload — the pressure falls and the coronaries (already struggling to feed a thick ventricle) fall with it.'],
  ['“Fine — one puff, and repeat the troponin at one hour.”',0,'In severe AS a nitrate can turn a tight chest into a cardiac arrest: preload falls, the stiff ventricle under-fills, output cannot rise through a fixed orifice, BP collapses, coronary perfusion follows.',{hr:112,bp:'74/48',spo2:92,rr:24}],
  ['“Load aspirin and ticagrelor, call the cath lab.”',0,'A flat, minimally raised troponin in a hypertrophied ventricle is demand ischaemia far more often than plaque rupture. Dual antiplatelets in a pale man you have not examined is how a GI bleed becomes a transfusion.'],
  ['“CT head first — he lost consciousness.”',1,'Reasonable only if there were head injury or focal signs. Twenty seconds of exertional syncope with full recovery is a cardiac problem; do not send him to the scanner unmonitored.']]}],
 ['act','You listen. A harsh, late-peaking systolic murmur at the right upper sternal edge, climbing into both carotids. The second sound is single and soft. The carotid upstroke is slow, like something pushing through mud.'],
 ['reveal','🧪 Order: first bloods','<div class="scroll"><table><tr><th>Test</th><th>Result</th><th>Read it as</th></tr><tr><td>hs-Troponin T 0 h → 1 h</td><td>38 → 41 ng/L</td><td>Raised, <b>flat</b>: chronic injury of a pressure-loaded LV, not an acute plaque event</td></tr><tr><td>Haemoglobin</td><td class="hi">9.1 g/dL · MCV 72</td><td>Microcytic anaemia — <b>why?</b> Nobody has asked yet</td></tr><tr><td>NT-proBNP</td><td class="hi">2,900 pg/mL</td><td>Wall stress</td></tr><tr><td>Creatinine / eGFR</td><td>1.2 mg/dL / 58</td><td>Matters for CT contrast and the procedure</td></tr><tr><td>Lactate</td><td>1.4</td><td>Perfusing — for now</td></tr></table></div>'],
 ['reveal','📈 Read the ECG','<p>Sinus rhythm 88. <b>LVH with strain</b> (ST depression and T inversion V5–V6, I, aVL). <b>Complete right bundle branch block</b>, PR 210 ms. No acute ST elevation.</p><p class="mono">Remember the right bundle. It will matter in six days.</p>'],
 ['say','ed','So what’s the bedside echo show, professor?'],
 ['act','You put the probe down. The aortic valve is a white, barely moving knot. The ventricle is thick and squeezing hard.'],
 ['q',{id:'er2',ask:'Where does he go from the ED?',opts:[
  ['Monitored cardiology bed, continuous telemetry, no vasodilators, formal echo in the morning',2,'Syncope in suspected severe AS is a high-risk feature: admit monitored. Untreated symptomatic severe AS carries roughly 50% mortality at two years.'],
  ['Home tonight with an urgent outpatient echo',0,'Exertional syncope with a structural cause is a red flag in every syncope guideline. He does not go home.'],
  ['General medical ward, routine observations',1,'Right to admit; wrong place. He needs telemetry and a team that will not give him amlodipine and a nitrate.'],
  ['Straight to the cath lab for angiography tonight',0,'There is no STEMI. Angiography is part of the work-up — planned, in daylight, after the valve is defined.']]}],
 ['say','hassan','You’re all very dramatic. Five weeks. I’m walking her down that aisle.'],
 ['act','He says it like a deadline on a building permit. You write it down. It will become the most important line in his file.']
]},
/* ---------------- 2 · SBAR ---------------- */
{id:'sbar',nav:'🌙 Handover',clock:'Day 1 · 07:30',mon:{hr:84,bp:'112/82',spo2:96,rr:18,rhy:'SR'},b:[
 ['slug','Residents’ room — handover — 07:30'],
 ['act','Omar has been awake for twenty-six hours. The coffee is older than that. He hands over nine patients; bed 4 is the last, and he is already reaching for his jacket.'],
 ['say','omar','<b>S</b> — Bed 4, Hassan El-Sayed, 72, admitted from ED at midnight with exertional syncope and a murmur that sounds like severe AS. Stable overnight.'],
 ['say','omar','<b>B</b> — Hypertensive on amlodipine 10 and ramipril 5. Takes ibuprofen “most days” for his knees. No diabetes, never smoked. Lives independently, still works two days a week.'],
 ['say','omar','<b>A</b> — BP 112/82, sinus 84, sats 96 on air. Trop flat. Bedside echo: calcified valve, good LV. Hb 9.1. No further syncope. Tele showed nothing.'],
 ['say','omar','<b>R</b> — Formal echo this morning, consultant review at nine. I charted his home meds, PRN GTN for the chest tightness and enoxaparin prophylaxis. That’s it. Can I go?'],
 ['q',{id:'sbar1',multi:true,ask:'Before he leaves — what in that handover would you stop him for? Select every problem.',opts:[
  ['PRN GTN is on the drug chart of a man with suspected severe AS',1,'A PRN order is a loaded gun: at 03:00 a nurse will follow the chart. Strike it off.'],
  ['Amlodipine 10 mg and ramipril 5 mg were continued unchanged after syncope with BP 108 systolic',1,'Not “never” drugs in AS — but after syncope with a low BP, hold them until the haemodynamics are defined.'],
  ['Hb 9.1, microcytic, on daily ibuprofen — and nobody has asked about stool colour or sent iron studies',1,'An unexplained microcytic anaemia in a man with AS is a diagnosis waiting to be made. It will change the antithrombotic plan and the valve debate.'],
  ['The ECG showed RBBB with a long PR and it was not handed over',1,'Conduction disease at baseline is the strongest predictor of needing a pacemaker after valve intervention. It belongs in the handover.'],
  ['Enoxaparin prophylaxis was prescribed',0,'Reasonable while the anaemia is stable and unexplained — review it, but it is not the error here.'],
  ['He was put on telemetry',0,'Correct, not a problem.']]}],
 ['say','omar','…I missed the GTN. Strike it. And you’re right about the haemoglobin — I assumed chronic disease.'],
 ['say','you','Ibuprofen, pallor, MCV 72. I’ll ask him about his stools and send ferritin before the consultant does.'],
 ['card','🧠 Why SBAR fails at 07:30','<ul><li><b>Recommendation is the weakest letter.</b> “Formal echo, consultant review” is a schedule, not a plan. A plan says what must <b>not</b> happen: no vasodilators, no NSAIDs, no discharge.</li><li><b>Abnormal results get normalised overnight.</b> “Hb 9.1” said flatly sounds like a fact; it is a question.</li><li><b>The drug chart is the real handover.</b> What is written is what will be given.</li></ul>','burn']
]},
/* ---------------- 3 · Resident review ---------------- */
{id:'review',nav:'🩺 Your review',clock:'Day 1 · 08:05',mon:{hr:82,bp:'114/84',spo2:96,rr:18,rhy:'SR'},b:[
 ['slug','Bed 4 — 08:05'],
 ['say','you','Mr El-Sayed, before last night — stairs, hills — anything different these last months?'],
 ['say','hassan','I stopped walking to the office in spring. I told my wife it was my knees.'],
 ['say','dina','Baba. You stopped at every lamp-post. You said the pavement was uneven.'],
 ['say','hassan','…Three months. Breathless by the second floor. And a tightness, here. It goes when I stop.'],
 ['say','you','And your stools — ever black? Like tar?'],
 ['say','hassan','On and off since winter. I thought it was the iron tablets my pharmacist gave me.'],
 ['act','Exertional dyspnoea. Exertional angina. Exertional syncope. And melaena. He has collected the full triad — and something else.'],
 ['card','🫀 The triad is a clock','<p>Ross &amp; Braunwald’s natural history still holds: once symptoms begin, average survival without valve replacement is about <b>5 years after angina, 3 after syncope, 2 after heart failure</b>. He has all three. The valve is no longer a finding; it is a deadline.</p>'],
 ['reveal','🖐️ Examine him','<ul><li><b>Pulse:</b> low volume, slow-rising (<i>parvus et tardus</i>) — in the elderly a stiff aorta can mask it; here it is unmistakable.</li><li><b>Apex:</b> sustained, not displaced — pressure overload, not volume.</li><li><b>S2:</b> single and soft — the aortic component is gone. This is the best bedside sign of severity.</li><li><b>Murmur:</b> harsh ejection systolic, <b>late-peaking</b>, to both carotids; musical at the apex (Gallavardin).</li><li><b>Conjunctivae pale.</b> No stigmata of liver disease. Abdomen soft. PR: dark stool on the glove.</li></ul>'],
 ['slug','Echo lab — 08:50'],
 ['reveal','🖥️ Formal transthoracic echo','<div class="scroll"><table><tr><th>Measure</th><th>Result</th><th>Severe AS if</th></tr><tr><td>Peak velocity</td><td class="lo">3.8 m/s</td><td>≥ 4.0</td></tr><tr><td>Mean gradient</td><td class="lo">34 mmHg</td><td>≥ 40</td></tr><tr><td>Valve area (continuity)</td><td class="hi">0.78 cm²</td><td>≤ 1.0</td></tr><tr><td>Indexed AVA</td><td class="hi">0.41 cm²/m²</td><td>≤ 0.6</td></tr><tr><td>Dimensionless index</td><td class="hi">0.22</td><td>≤ 0.25</td></tr><tr><td>LVEF</td><td>58%</td><td>—</td></tr><tr><td>Stroke volume index</td><td class="hi">30 mL/m²</td><td>low flow ≤ 35</td></tr><tr><td>LV</td><td>Concentric hypertrophy, small cavity, GLS −13%</td><td></td></tr><tr><td>BP during study</td><td>114/84</td><td></td></tr></table></div><p>Area says severe. Gradient says moderate. Ejection fraction says nothing is wrong.</p>'],
 ['q',{id:'rev1',ask:'The numbers disagree. The sonographer has written “moderate–severe AS”. What is your next move?',opts:[
  ['Check for measurement error (LVOT diameter, flow, BP), recognise paradoxical low-flow low-gradient AS — and get a CT calcium score of the valve',2,'<b>Preserved EF + SVi ≤ 35 + small AVA + mean gradient &lt; 40</b> is paradoxical low-flow, low-gradient AS: a small, thick, stiff ventricle that ejects little. First exclude error (LVOT is squared in the equation), then let CT calcium arbitrate: <b>≥ 2,000 AU in men / ≥ 1,200 AU in women</b> makes severe AS likely.'],
  ['Call it moderate and repeat the echo in six months',0,'A man with all three cardinal symptoms and an AVA of 0.78 does not have six months. Gradient depends on flow; low flow makes a severe valve look moderate.'],
  ['Low-dose dobutamine stress echo',1,'The right test for <b>classical</b> low-flow low-gradient AS — where the EF is reduced and you need to separate true-severe from pseudo-severe. With a preserved EF and a small cavity it adds little; calcium scoring is the recommended arbiter.'],
  ['Invasive haemodynamic study with retrograde crossing of the valve',1,'Occasionally needed when non-invasive data stay discordant. Crossing a calcified valve carries embolic stroke risk — not the first step.']]}],
 ['reveal','🧮 CT aortic valve calcium score','<p class="big">2,650 <span class="mono">Agatston units</span></p><p>Above the male threshold of 2,000. <b>True severe aortic stenosis</b> — paradoxical low-flow, low-gradient.</p>'],
 ['reveal','🧪 The anaemia work-up you sent','<div class="scroll"><table><tr><td>Ferritin</td><td class="hi">8 µg/L</td></tr><tr><td>Transferrin saturation</td><td class="hi">7%</td></tr><tr><td>Platelets / INR / aPTT</td><td>Normal</td></tr><tr><td>Faecal immunochemical test</td><td class="hi">Positive</td></tr></table></div><p>Iron deficiency from chronic GI blood loss. NSAIDs would be the easy answer.</p>']
]},
/* ---------------- 4 · Consultant round ---------------- */
{id:'round',nav:'👩‍⚕️ Consultant round',clock:'Day 1 · 09:20',mon:{hr:80,bp:'116/82',spo2:96,rr:18,rhy:'SR'},b:[
 ['slug','Bed 4 — ward round — 09:20'],
 ['act','Dr Layla Haddad does not sit. She reads the echo report standing, flips it over as if the answer might be on the back, and looks at you instead of the patient.'],
 ['say','layla','Peak velocity 3.8. Mean gradient 34. My sonographer says moderate-to-severe, which is echo-speak for “I don’t want to be wrong”. You’ve had him for ninety minutes. Is this valve killing him or not?'],
 ['say','you','It’s severe. Area 0.78, index 0.22, stroke volume index 30 with an EF of 58 — paradoxical low-flow low-gradient. Calcium score 2,650.'],
 ['say','layla','Good. Now tell me why a ventricle with an ejection fraction of 58 percent has a low stroke volume. It’s squeezing beautifully.'],
 ['q',{id:'rd1',ask:'Why is flow low when the ejection fraction is “normal”?',opts:[
  ['Concentric remodelling leaves a small, stiff cavity: a normal fraction of a small volume is a small stroke volume — and longitudinal function (GLS −13%) is already impaired',2,'<b>EF is a ratio, not an output.</b> 58% of a 55 mL cavity is 32 mL. Add diastolic dysfunction, a hypertensive afterload and often AF, and flow falls while EF looks reassuring. Strain shows the damage EF hides.'],
  ['Because the measurement is wrong — EF and stroke volume must agree',0,'They measure different things. Error must be excluded, but the pattern is real and common — up to a third of severe AS.'],
  ['Because of the anaemia',0,'Anaemia raises cardiac output; it would inflate gradients, not lower them.'],
  ['Because of mitral regurgitation stealing forward flow',1,'A true cause of low forward flow and worth excluding — but he has none of significance.']]}],
 ['card','📐 Four patterns — one valve area','<div class="scroll"><table><tr><th>Pattern</th><th>Gradient</th><th>Flow (SVi)</th><th>EF</th><th>Sort it out with</th></tr><tr><td>High-gradient</td><td>≥ 40</td><td>any</td><td>any</td><td>Nothing — it is severe</td></tr><tr><td>Classical LF-LG</td><td>&lt; 40</td><td>≤ 35</td><td>&lt; 50%</td><td>Dobutamine echo: true vs pseudo-severe; flow reserve</td></tr><tr><td><b>Paradoxical LF-LG</b></td><td>&lt; 40</td><td>≤ 35</td><td>≥ 50%</td><td><b>CT calcium score</b>; exclude error and hypertension</td></tr><tr><td>Normal-flow LG</td><td>&lt; 40</td><td>&gt; 35</td><td>≥ 50%</td><td>Usually moderate; re-measure, calcium score</td></tr></table></div>'],
 ['say','layla','Next. He fainted on a staircase, not in a chair. Why does this disease wait for stairs?'],
 ['say','you','Exercise dilates the muscle beds. Normally output rises to hold pressure. Through a fixed orifice it can’t — pressure falls, the brain goes first.'],
 ['say','layla','And the LV baroreceptors, firing at a wall stress they’ve never seen, add reflex vasodilation and bradycardia on top. Plus the arrhythmias you didn’t catch. Three mechanisms, one landing. Now — the haemoglobin.'],
 ['say','you','Iron deficient, FIT positive, melaena on and off. He takes ibuprofen. I’d stop the NSAID and book an upper GI endoscopy.'],
 ['say','layla','An old man with aortic stenosis is bleeding from his gut and you want to blame his knees. Think. What does blood do when it is forced through a slit at four metres a second?'],
 ['q',{id:'rd2',ask:'What is Dr Haddad asking you to see?',opts:[
  ['Heyde syndrome: shear across the valve unfolds von Willebrand factor, ADAMTS13 cleaves its large multimers, and angiodysplasia bleeds — acquired type 2A von Willebrand syndrome',2,'<b>Heyde syndrome.</b> Platelet count and clotting screen are normal; the defect is in the high-molecular-weight vWF multimers (and a prolonged PFA-100 closure time). It <b>resolves after the valve is replaced</b> — which makes fixing the valve the treatment for the bleeding, and changes how you weigh antithrombotics and the choice of prosthesis.'],
  ['Occult colorectal cancer — he needs colonoscopy before anything cardiac',1,'It must be excluded in due course at 72. But delaying a valve with a two-year mortality of 50% for a bowel work-up reverses the priorities — and endoscopy under sedation in untreated severe AS is not trivial.'],
  ['NSAID gastropathy — stop the ibuprofen and move on',1,'Stop it, certainly. But stopping at the first plausible cause is how the second diagnosis is missed.'],
  ['Haemolysis across the calcified valve',0,'Mechanical haemolysis belongs to prostheses and paravalvular leaks; it does not cause iron-deficient melaena.']]}],
 ['say','layla','Send vWF multimers. Stop the ibuprofen. IV iron today. And nobody scopes him until I say so. What does the bleeding do to our valve discussion?'],
 ['say','you','A mechanical valve is out — lifelong warfarin in a bleeder. And every antiplatelet we add after a stent or a TAVI costs more for him than for the trial population.'],
 ['say','layla','Now you’re treating the patient instead of the echo. Last question, and it’s the only one that matters to him. He’s 72. Who replaces this valve — Karim with a saw, or Selim with a catheter?'],
 ['card','📜 What the guidelines actually say','<ul><li><b>Intervention is indicated</b> in symptomatic severe AS — high-gradient, and low-gradient when severity is confirmed (Class I).</li><li><b>2025 ESC/EACTS:</b> the mode is a <b>Heart Team</b> decision. <b>TAVI is recommended at ≥ 70 years</b> for tricuspid valves with suitable transfemoral anatomy; <b>SAVR is recommended below 70</b> at low surgical risk. The threshold came down from 75 in 2021.</li><li><b>2020 ACC/AHA:</b> SAVR &lt; 65; <b>shared decision 65–80</b>; TAVI &gt; 80 or life expectancy &lt; 10 years.</li><li>At <b>72</b> he is a TAVI candidate in Europe and a coin-toss in America. Guidelines give you a starting point; anatomy, lifetime management and the patient decide.</li></ul>','ev'],
 ['card','🔬 The trials behind the argument','<div class="scroll"><table><tr><th>Trial</th><th>Who</th><th>What it showed</th></tr><tr><td>PARTNER 3 (5 y)</td><td>Low risk, mean age 73, balloon-expandable</td><td>Death/stroke/rehospitalisation ≈ 23% TAVI vs 27% SAVR — early advantage, <b>curves converge</b> by 5 years</td></tr><tr><td>Evolut Low Risk (4–5 y)</td><td>Low risk, self-expanding</td><td>Death or disabling stroke similar; better haemodynamics, more pacemakers and mild leak with TAVI</td></tr><tr><td>NOTION (10 y)</td><td>All-comers ≥ 70, mostly low risk</td><td>No difference in mortality; <b>less structural valve deterioration</b> with TAVI at 10 years</td></tr><tr><td>DEDICATE (1 y)</td><td>Low–intermediate risk, mean 74</td><td>Death or stroke ≈ 5% TAVI vs 10% SAVR — TAVI non-inferior</td></tr><tr><td>UK TAVI</td><td>≥ 70, real-world</td><td>Non-inferior for death at 1 year; shorter stay, more vascular events and pacing</td></tr><tr><td>NOTION-3</td><td>TAVI + significant CAD</td><td>PCI of physiologically significant lesions <b>reduced death/MI/urgent revascularisation</b>, at the cost of bleeding</td></tr></table></div><p>What no trial yet answers: <b>durability beyond 10 years in a 65–75-year-old</b>, and what happens at the second valve.</p>','ev'],
 ['q',{id:'rd3',ask:'Dr Haddad: “And if he had no symptoms at all — same valve, found by accident?”',opts:[
  ['Intervene if EF < 50%, an abnormal exercise test, Vmax ≥ 5 m/s, rapid progression or markedly raised BNP — and after EARLY TAVR, AVATAR and RECOVERY early intervention in low-risk high-gradient patients is a reasonable alternative to waiting',2,'<b>EARLY TAVR (2024):</b> asymptomatic severe AS — death/stroke/unplanned hospitalisation ≈ 27% with early TAVR vs 45% with surveillance, driven by hospitalisation; a quarter of the “asymptomatic” converted within months. <b>AVATAR</b> and <b>RECOVERY</b> showed the same direction with surgery; <b>EVOLVED</b> (fibrosis-guided) was neutral. The 2025 ESC/EACTS guideline now says intervention <b>should be considered</b> in asymptomatic high-gradient severe AS at low procedural risk.'],
  ['Watchful waiting until symptoms, always',0,'That was the teaching for forty years. “Asymptomatic” often means “has stopped climbing stairs” — as his daughter just told you.'],
  ['Everyone with severe AS gets a valve immediately',1,'Closer than it used to be, but still a decision: procedural risk, valve durability started earlier, and true symptom status (exercise test) all matter.'],
  ['Start a statin to slow progression',0,'SALTIRE, SEAS and ASTRONOMER: statins do not slow calcific AS. No drug does — yet.']]}],
 ['say','layla','Book the CT and the angiogram. Heart team tomorrow at eight. And somebody ask the man what he wants — it’s his chest.']
]},
/* ---------------- 5 · The chart ---------------- */
{id:'chart',nav:'📁 The file',clock:'Day 1 · 11:00',mon:{hr:78,bp:'118/80',spo2:97,rr:16,rhy:'SR'},b:[
 ['slug','Nurses’ station — 11:00'],
 ['say','mariam','Round’s over, which means the real work starts. Write it up properly — if it isn’t in the file, it didn’t happen, and my night staff will do exactly what the chart tells them.'],
 ['html','<div class="chart"><div class="chart-h"><div><b>EL-SAYED, Hassan</b> · 72 M · MRN 48-2217</div><div class="mono">Consultant: Dr L. Haddad · Allergies: none known · Code status: full</div></div><div class="ctabs" id="ctabs"></div><div class="cbody" id="cbody"></div></div>'],
 ['q',{id:'ch1',ask:'Hb 9.1 g/dL, iron deficient, slow melaena, haemodynamically stable. Mariam asks what to do about the haemoglobin before the cath lab.',opts:[
  ['IV iron now (e.g. ferric carboxymaltose 1 g), group & save, transfuse only if Hb < 8 or symptomatic — and plan the valve as the definitive treatment of the bleeding',2,'Restrictive transfusion (threshold ~7–8 g/dL) is as safe as liberal in stable cardiac patients; each unit is also a volume load into a stiff ventricle. IV iron corrects the deficit over 2–3 weeks. In Heyde syndrome, bleeding stops in most patients after valve replacement.'],
  ['Transfuse two units today to get him above 10',1,'Not wrong if he were symptomatic from anaemia, but unnecessary here — and 600 mL into a preload-sensitive, diastolically stiff LV invites pulmonary oedema. If you must, one unit, slowly, with a diuretic plan.'],
  ['Oral ferrous sulfate and re-check in a month',0,'Too slow for a man going to a procedure with antithrombotics within days, and poorly absorbed in ongoing blood loss.'],
  ['Cancel the cardiac work-up until gastroenterology has scoped him top and bottom',0,'This inverts the risk. Stabilise, give iron, replace the valve; endoscopic work-up follows — unless bleeding becomes brisk.']]}],
 ['card','🗂️ What a good file does','<ul><li>The <b>problem list is ranked</b> — number one is the thing that will kill him first.</li><li>Every held drug says <b>why</b> and <b>until when</b>.</li><li>Nursing orders name the <b>trigger and the call</b>: “SBP &lt; 95 or HR &gt; 120 → call resident, do not give PRN antihypertensives”.</li><li>The plan includes what the patient said he wants. <i>“Wishes to attend daughter’s wedding in 5 weeks”</i> is clinical information.</li></ul>']
]},
/* ---------------- 6 · Heart team ---------------- */
{id:'team',nav:'👥 Heart team',clock:'Day 2 · 08:00',mon:{hr:76,bp:'120/80',spo2:97,rr:16,rhy:'SR'},b:[
 ['slug','Conference room B — Heart Team — Day 2, 08:00'],
 ['act','A CT reconstruction of Hassan’s aortic root rotates on the wall, white with calcium. A surgeon, an interventionalist, an anaesthetist and a consultant who enjoys arguments sit around a table that is too small for their opinions.'],
 ['reveal','🧊 CT TAVI protocol','<div class="scroll"><table><tr><td>Valve</td><td>Tricuspid, heavily calcified, <b>no LVOT calcium</b></td></tr><tr><td>Annulus</td><td>Area 468 mm², perimeter 77 mm → 26 mm balloon-expandable or 29 mm self-expanding</td></tr><tr><td>Coronary heights</td><td>Left main 13 mm, RCA 15 mm; sinuses 32 mm</td></tr><tr><td>Access</td><td>Femorals 7.2 / 7.0 mm, mild calcification, no tortuosity</td></tr><tr><td>Aorta</td><td>Ascending 37 mm, no porcelain</td></tr><tr><td>Membranous septum</td><td class="lo">Short — 3 mm</td></tr></table></div>'],
 ['reveal','🧵 Coronary angiogram','<p><b>Proximal LAD 75% stenosis</b>, focal, type A. Circumflex and RCA: mild irregularity. Left main clear.</p>'],
 ['reveal','📊 Risk','<p>STS-PROM <b>1.9%</b> · EuroSCORE II 1.6% · Clinical Frailty Scale 3 · 5-m walk 5.1 s · independent, cognitively sharp. Actuarial life expectancy ≈ 13–14 years.</p>'],
 ['say','karim','He’s 72, STS under two, and he has a proximal LAD lesion. Give me ninety minutes: a tissue valve and a LIMA to the LAD. The mammary will outlive all of us. You’re offering him a stent with dual antiplatelets — in a man who is already bleeding.'],
 ['say','selim','And you’re offering full heparinisation, a bypass circuit and a sternotomy to a man with acquired von Willebrand syndrome. ESC says TAVI at seventy. His femorals are tramlines. He’s home in three days, not three months.'],
 ['say','karim','Home with a pacemaker. He has a right bundle and a three-millimetre membranous septum. That’s a one-in-three chance of a box in his chest, and pacing isn’t free in a hypertrophied ventricle.'],
 ['say','selim','SAVR isn’t pacemaker-free either. And your valve fails at 85 — then what? Redo sternotomy?'],
 ['say','karim','Then <i>your</i> valve goes inside mine, into a 25 millimetre surgical frame I chose for exactly that reason. If your valve fails at 85, he gets a TAVI-in-TAVI with a coronary you may never reach again.'],
 ['say','anaes','For what it’s worth: paradoxical low-flow, small stiff ventricle. Those are the patients who hate induction. I can do either. I’d sleep better with conscious sedation.'],
 ['say','layla','Both of you are right, which is why this meeting exists. Resident. You’ve examined him, you know what he wants. Vote.'],
 ['q',{id:'tm1',ask:'What do you recommend for Mr El-Sayed?',opts:[
  ['Transfemoral TAVI with PCI to the LAD — and say plainly that SAVR + LIMA is a legitimate alternative he must be offered',2,'<b>The team’s decision.</b> Age ≥ 70 with favourable tricuspid anatomy and femoral access (2025 ESC/EACTS), <b>Heyde bleeding</b> that makes bypass and prolonged antithrombotics costly, a low-flow ventricle that tolerates anaesthesia poorly, and an informed patient preference. NOTION-3 supports treating a significant proximal LAD lesion. The price — discussed, not hidden — is a pacemaker risk near 30% and uncertainty about the second valve.'],
  ['SAVR with a bioprosthesis + LIMA–LAD',1,'<b>Defensible</b> — and what many surgical centres would do: proven durability, the best conduit for the LAD, lower pacing risk than TAVI, clean coronary access for life. Against it here: bleeding diathesis on bypass, longer recovery, and his explicit priorities. Not wrong. Not this patient’s first choice.'],
  ['Mechanical SAVR — one valve for life at 72',0,'Lifelong warfarin in a man bleeding from angiodysplasia. And guidelines favour bioprostheses above 65 in the aortic position.'],
  ['Balloon valvuloplasty now, decide later',0,'A bridge for the unstable patient, not a strategy: restenosis within months, with a real stroke and regurgitation risk.']]}],
 ['card','♟️ Lifetime management — the move after next','<ul><li><b>Sequence matters more than the first valve.</b> SAVR → TAVI-in-SAVR is the most predictable path. TAVI → TAVI-in-TAVI depends on coronary heights, sinus width and commissural alignment at the first implant.</li><li><b>His anatomy helps:</b> left main 13 mm, sinuses 32 mm, no LVOT calcium — a redo-TAVI at 85 is plausible. Record commissural alignment today.</li><li><b>Coronary access after TAVI</b> is harder with tall supra-annular frames; with CAD, a short intra-annular balloon-expandable valve keeps the ostia reachable.</li><li><b>Small annulus</b> (SMART trial): supra-annular self-expanding valves give better haemodynamics — not his problem at 468 mm².</li></ul>'],
 ['slug','Bed 4 — 10:30'],
 ['say','layla','Two good options. One opens your chest, one goes through your leg. The leg is faster and bleeds less; the chest has a longer track record and fixes the artery with your own tissue. With the catheter there is about a one-in-three chance you’ll need a pacemaker.'],
 ['say','hassan','If I choose the catheter, do I walk at the wedding?'],
 ['say','layla','Very probably.'],
 ['say','hassan','Then I’ve been an architect for forty-five years, doctor. I know when a client has already decided.'],
 ['q',{id:'tm2',ask:'TAVI and PCI — in which order?',opts:[
  ['PCI to the proximal LAD first (or in the same sitting, before deployment), then TAVI',2,'A proximal LAD lesion in a hypertrophied ventricle is the wrong thing to leave during rapid pacing, and coronary access is easiest before the frame is in. NOTION-3 randomised PCI <i>before or with</i> TAVI. ACTIVATION (weaker lesions, more bleeding) reminds us not to stent everything.'],
  ['TAVI first, PCI weeks later through the valve frame',1,'Possible, and some centres prefer to judge the lesion after the valve is fixed. But a tight proximal LAD is the lesion you least want untreated during deployment.'],
  ['TAVI only; treat the LAD medically',1,'Reasonable for stable, non-proximal or borderline lesions. A 75% proximal LAD with exertional angina is not that.'],
  ['PCI now, discharge, TAVI in three months after DAPT is finished',0,'Dual antiplatelets for three months in a bleeding man with untreated symptomatic severe AS: two risks instead of one.']]}],
 ['say','mariam','Consent done, iron done, groin shaved for tomorrow. He’s asked for the bed by the window. Says he wants to look at a building he drew.']
]},
/* ---------------- 7 · Events ---------------- */
{id:'events',nav:'⚡ New events',clock:'Day 3 · 02:14',mon:{hr:158,bp:'78/46',spo2:84,rr:34,rhy:'AF'},b:[
 ['slug','Bed 4 — night before the procedure — 02:14'],
 ['act','The alarm is a sound you feel in your teeth. Hassan is bolt upright, grey, drowning on dry land, clawing at the oxygen mask as if it were the thing stopping him breathing.'],
 ['say','mariam','Fast AF, 158. Pressure seventy-eight systolic. Sats 84 on fifteen litres. He was fine at midnight. Crackles to the apices.'],
 ['say','hassan','Can’t… breathe…'],
 ['card','⚙️ Why AF is a catastrophe here','<p>A thick, stiff ventricle fills late — <b>atrial contraction supplies up to 40% of its stroke volume</b>. Fast AF removes the kick <i>and</i> shortens diastole. Filling collapses, LA pressure rockets, output falls through a fixed orifice, coronary perfusion pressure falls, the ventricle stiffens further. This loop ends in arrest within minutes.</p>','burn'],
 ['q',{id:'ev1',ask:'Fast AF, BP 78/46, pulmonary oedema. First action?',opts:[
  ['Synchronised DC cardioversion now (biphasic 150–200 J), brief sedation with an anaesthetist, pads AP',2,'<b>Haemodynamically unstable AF → electricity.</b> Restoring atrial contraction is the fastest way to restore filling. Sedate with the smallest dose that works (etomidate or a little ketamine/midazolam — not a propofol bolus). Anticoagulate afterwards.',{hr:84,bp:'88/54',spo2:90,rr:28,rhy:'SR'}],
  ['IV metoprolol 5 mg to slow the rate',0,'A negative inotrope into a ventricle that is failing to fill and failing to eject. The rate falls and so does the patient.',{hr:120,bp:'62/38',spo2:80,rr:36,rhy:'AF'}],
  ['GTN infusion and furosemide 80 mg IV for the pulmonary oedema',0,'The oedema is from failed filling, not volume overload. Vasodilating a fixed-output circulation at 78 systolic is the textbook way to arrest a patient with AS.',{hr:164,bp:'58/34',spo2:78,rr:38,rhy:'AF'}],
  ['IV amiodarone 300 mg over an hour',1,'The right drug when the patient is stable and cardioversion has to wait. He does not have an hour.',{hr:150,bp:'74/44',spo2:83,rr:34,rhy:'AF'}]]}],
 ['act','One shock. The monitor draws a flat line that lasts forever, then a P wave, then another. Sinus rhythm, 84.'],
 ['say','mariam','Sinus. But he’s still only 88 systolic and he’s still wet.'],
 ['q',{id:'ev2',ask:'Sinus rhythm restored. BP 88/54, SpO₂ 90% on high flow, still in pulmonary oedema. How do you support the pressure?',opts:[
  ['Vasopressor: phenylephrine boluses 50–100 µg or low-dose noradrenaline, then cautious furosemide 20–40 mg once perfusion pressure is held; CPAP',2,'In AS the goal is <b>coronary perfusion pressure</b>: raise diastolic pressure with an α-agonist, keep sinus rhythm and a slowish rate, keep preload. Then offload gently. This is the opposite of what you would do in acute MR.',{hr:78,bp:'108/64',spo2:95,rr:22,rhy:'SR'}],
  ['Dobutamine 5 µg/kg/min',1,'Sometimes needed when the LV is truly failing — but it raises rate and oxygen demand, provokes AF again and can drop pressure through β2 vasodilation. Not first here with a preserved EF.',{hr:112,bp:'92/50',spo2:91,rr:26,rhy:'SR'}],
  ['A 1,000 mL crystalloid bolus — he’s preload dependent',0,'Preload dependent does not mean volume-deplete. He is in pulmonary oedema; a litre fills his alveoli, not his ventricle.',{hr:96,bp:'86/50',spo2:84,rr:34,rhy:'SR'}],
  ['High-dose nitrate infusion to offload',0,'Still a fixed orifice. Still 88 systolic.',{hr:104,bp:'70/40',spo2:86,rr:32,rhy:'SR'}]]}],
 ['say','you','Dr Haddad — sorry to wake you. Fast AF with flash oedema, cardioverted, now on a whisper of noradrenaline, 108 systolic, sats 95 on CPAP.'],
 ['say','layla','Don’t apologise for the right call. He has just told us what his reserve is: none. What does that do to tomorrow’s list?'],
 ['q',{id:'ev3',ask:'What happens to the plan?',opts:[
  ['Move him to first on the list: urgent TAVI + LAD PCI this morning, heparin for the AF, CCU until then',2,'Decompensation is the indication, not the contraindication. Urgent TAVI in acutely decompensated AS has acceptable results, and every further hour in this state risks another loop. Anticoagulate — he now has AF with a CHA₂DS₂-VA of 3.',{hr:76,bp:'112/66',spo2:96,rr:20,rhy:'SR'}],
  ['Balloon aortic valvuloplasty as a bridge, TAVI in a few weeks',1,'A fair rescue where urgent TAVI is not available or the work-up is incomplete. His CT is done and the team is ready.'],
  ['Postpone two weeks to “optimise” him with diuretics and beta-blockers',0,'There is no medical optimisation of a fixed obstruction. Two weeks is a long time to stand on a trapdoor.'],
  ['Emergency SAVR tonight',1,'An option in surgical centres, but operative risk after cardiogenic pulmonary oedema is far higher than his STS of yesterday.']]}],
 ['slug','Hybrid lab — Day 3, 08:40'],
 ['act','Conscious sedation. A drug-eluting stent in the proximal LAD. Then a 26 mm balloon-expandable valve, deployed high — 80/20 — under rapid pacing at 180. The gradient falls from 34 to 6. No leak. Hassan sleeps through the most important ten seconds of his year.'],
 ['say','selim','Valve’s perfect. He’s got a new left bundle on top of his old right bundle for a few beats there, then back to RBBB. I’m not happy with that septum.'],
 ['q',{id:'ev4',ask:'Baseline RBBB, PR 210 ms, short membranous septum, transient conduction change at deployment. What about the temporary pacing wire?',opts:[
  ['Leave it in, secured, with back-up pacing at 40/min and telemetry for at least 24–48 h',2,'Pre-existing RBBB is the strongest predictor of high-grade AV block after TAVI — and delayed block can appear hours to days later. The wire stays.'],
  ['Remove it — he is in sinus rhythm with stable conduction',0,'This is the decision that turns a manageable event at 15:00 into a cardiac arrest call.'],
  ['Implant a permanent pacemaker prophylactically before he leaves the lab',1,'Not recommended on RBBB alone: many never need it, and RV pacing has its own cost. Watch, monitor, decide on evidence.'],
  ['Remove it and rely on transcutaneous pads',1,'Pads are a bridge of minutes, capture unreliably and hurt. With this risk profile, keep the wire.']]}],
 ['slug','CCU — Day 3, 15:20'],
 ['mon',{hr:32,bp:'82/40',spo2:94,rr:20,rhy:'CHB'}],
 ['act','Dina is reading him the seating plan when he stops answering. The monitor shows P waves marching at 80 and broad QRS complexes wandering at 32, with nothing to say to each other.'],
 ['say','dina','Baba? BABA?'],
 ['say','mariam','Complete heart block, rate 32, pressure eighty-two. He’s clammy.'],
 ['q',{id:'ev5',ask:'Complete heart block with hypotension, six hours after TAVI.',opts:[
  ['Turn up the temporary wire: pace at 70–80/min, confirm capture on the monitor and a pulse with every spike; check threshold',2,'The wire you kept is the treatment. Infra-nodal block after TAVI does not respond to atropine. Confirm <b>mechanical</b> capture — a spike and a QRS are not a pulse.',{hr:75,bp:'118/62',spo2:97,rr:18,rhy:'V-paced'}],
  ['Atropine 600 µg IV, repeat to 3 mg',1,'Harmless to try once while you reach for the pacing box, but the block is below the node — the valve frame is pressing on the His bundle and left bundle. It will not work.',{hr:34,bp:'80/40',spo2:94,rr:20,rhy:'CHB'}],
  ['Isoprenaline infusion',1,'A bridge when there is no wire — at the cost of ischaemia and ventricular arrhythmia a day after a stent.',{hr:48,bp:'90/44',spo2:94,rr:20,rhy:'CHB'}],
  ['Observe — it may be transient oedema around the valve',0,'With a pressure of 82 and a rate of 32, observing is watching.',{hr:28,bp:'68/34',spo2:90,rr:22,rhy:'CHB'}]]}],
 ['act','You turn the dial. Spikes, then captured beats, then a pulse under your fingers. His colour comes back like a tide.'],
 ['say','hassan','…what did I miss? Did she put my brother at table one?'],
 ['q',{id:'ev6',ask:'Next morning he is still in complete heart block under the pacing. When does he get a permanent pacemaker?',opts:[
  ['Now: complete or high-grade AV block persisting 24–48 h after TAVI is a Class I indication — dual-chamber, ideally with a physiological pacing strategy',2,'2021 ESC pacing guidelines: persistent high-grade AV block 24–48 h after TAVI → permanent pacing. With a hypertrophied LV and an expected high ventricular pacing burden, consider conduction-system pacing rather than a plain RV apical lead.'],
  ['Wait seven days for recovery, as after cardiac surgery',0,'Seven days of a temporary wire means infection, perforation, immobility and delirium. After TAVI the window is 24–48 hours.'],
  ['Discharge with an ambulatory monitor',0,'That pathway is for new LBBB with a stable PR/QRS — not for complete heart block.'],
  ['Single-chamber VVI — simpler',1,'It would keep him alive, but he is in sinus rhythm with a stiff ventricle that needs its atrial kick. Keep AV synchrony.']]}],
 ['mon',{hr:70,bp:'126/70',spo2:98,rr:16,rhy:'A-sense V-pace'}],
 ['act','Day 4. A dual-chamber pacemaker with a left bundle branch area lead. Day 5: he walks the corridor twice. The melaena has stopped. The haemoglobin is 10.4.']
]},
/* ---------------- 8 · Discharge ---------------- */
{id:'home',nav:'🏠 Discharge & debrief',clock:'Day 6 · 10:00',mon:{hr:70,bp:'128/72',spo2:98,rr:16,rhy:'A-sense V-pace'},b:[
 ['slug','Bed 4 — Day 6 — the window bed'],
 ['say','layla','He now has a new valve, a new stent, a new pacemaker, paroxysmal AF and a gut that bled last week. Write me a discharge prescription that doesn’t kill him from either direction.'],
 ['q',{id:'hm1',ask:'Antithrombotic plan at discharge: TAVI + DES to the LAD + AF (CHA₂DS₂-VA 3) + recent GI bleeding.',opts:[
  ['A DOAC plus clopidogrel — no aspirin — for a short period (1–3 months given high bleeding risk, up to 6), then the DOAC alone for life; PPI',2,'AF needs anticoagulation; a fresh stent needs a P2Y12 inhibitor; aspirin on top (triple therapy) mainly buys bleeding. After TAVI with an OAC indication, <b>OAC alone</b> beat OAC + clopidogrel (POPular TAVI cohort B) — the clopidogrel here is for the stent, so keep it brief. Heyde bleeding should now subside.'],
  ['Aspirin alone for life — standard after TAVI',0,'Right for TAVI <b>without</b> another indication (POPular TAVI cohort A: aspirin alone beat DAPT). He has AF and a new stent.'],
  ['Triple therapy — aspirin, clopidogrel and a DOAC — for six months',0,'Maximum bleeding in a man who was transfusion-borderline a week ago, for no ischaemic gain.'],
  ['Warfarin, target INR 2.5',1,'Works, but DOACs bleed less intracranially and need no monitoring. (Dose-check edoxaban/apixaban for renal function; ENVISAGE-TAVI showed more bleeding with edoxaban than VKA in some patients — choose and dose carefully.)']]}],
 ['q',{id:'hm2',multi:true,ask:'What else goes in the discharge plan? Select all that belong.',opts:[

 ['card','🔥 Burn these in','<ul><li><b>Exertional syncope + slow pulse + single S2</b> is AS at the bedside. No vasodilators until you know.</li><li><b>Gradient depends on flow.</b> Small area, low gradient, preserved EF → paradoxical low-flow AS; arbitrate with CT calcium (≥ 2,000 ♂ / 1,200 ♀).</li><li><b>Anaemia in AS is a question</b> — think Heyde; the valve is the cure.</li><li><b>TAVI vs SAVR is a lifetime plan</b>: age (ESC 70 / ACC 65–80), anatomy, CAD, bleeding, conduction, the second valve — and what the patient wants.</li><li><b>AF in AS: electricity, then pressors.</b> Never beta-block or vasodilate a crashing fixed-output heart.</li><li><b>RBBB before TAVI = keep the wire.</b> Persistent block at 24–48 h = pacemaker.</li><li><b>Antithrombotics are subtracted, not added:</b> the fewest agents for the shortest time that cover each indication.</li></ul>','burn'],

 'Problems':'<table><tr><th>#</th><th>Problem</th><th>Status / plan</th></tr><tr><td>1</td><td><b>Severe calcific aortic stenosis</b> — paradoxical low-flow low-gradient (AVA 0.78, MG 34, SVi 30, Ca 2,650 AU); symptomatic: syncope, angina, dyspnoea NYHA III</td><td>Heart Team Day 2 · CT TAVI protocol + coronary angiography</td></tr><tr><td>2</td><td><b>Iron-deficiency anaemia, GI blood loss</b> (Hb 9.1, ferritin 8, FIT +) — ?Heyde syndrome</td><td>vWF multimers sent · IV iron · stop NSAID · G&amp;S · GI work-up after valve</td></tr><tr><td>3</td><td>Conduction disease: RBBB, PR 210 ms</td><td>Telemetry · pacing risk to be consented</td></tr><tr><td>4</td><td>Hypertension</td><td>Amlodipine and ramipril <b>held</b> pending haemodynamics</td></tr><tr><td>5</td><td>CKD 3a (eGFR 58)</td><td>Contrast precautions, avoid nephrotoxins</td></tr><tr><td>6</td><td>Patient goal</td><td><b>Daughter’s wedding in 5 weeks</b> — wishes to walk unaided</td></tr></table>',

 'Vitals':'<table><tr><th>Time</th><th>HR</th><th>BP</th><th>RR</th><th>SpO₂</th><th>Temp</th><th>NEWS2</th></tr><tr><td>00:30</td><td>88</td><td class="lo">108/84</td><td>20</td><td>95% RA</td><td>36.6</td><td>2</td></tr><tr><td>04:00</td><td>80</td><td>110/80</td><td>18</td><td>96%</td><td>36.5</td><td>1</td></tr><tr><td>08:00</td><td>82</td><td>114/84</td><td>18</td><td>96%</td><td>36.7</td><td>1</td></tr><tr><td>11:00</td><td>78</td><td>118/80</td><td>16</td><td>97%</td><td>36.6</td><td>0</td></tr></table><p class="mono">Pulse pressure 24–38 mmHg throughout · weight 78.4 kg · fluid balance −150 mL / 12 h · telemetry: sinus, RBBB, no pauses</p>',
 'Nursing orders':'<ul><li>Continuous telemetry — <b>do not disconnect for transfers</b></li><li>Observations 4-hourly; <b>call resident if SBP &lt; 95 or &gt; 160, HR &lt; 50 or &gt; 120, SpO₂ &lt; 92%, new chest pain, any syncope or pre-syncope</b></li><li><b>No nitrates, no PRN antihypertensives</b> — alert sticker on chart and door</li><li>Falls precautions; supervised mobilisation only; no stairs</li><li>Strict fluid balance, daily weight 06:00</li><li>Stool chart — report melaena or fresh blood</li><li>Two wide-bore cannulae · group &amp; save valid 72 h</li><li>Pre-angiography: clear fluids until 06:00, hold enoxaparin morning dose, consent with consultant</li><li>Family: daughter Dina, first contact</li></ul>',

/* ---------- engine ---------- */
const S={tab:0,ans:{},pts:0,max:0,seen:{}};
const $=s=>document.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
T.forEach(t=>t.b.forEach(b=>{if(b[0]==='q')S.max+=b[1].multi?b[1].opts.length:10}));
function mon(m){S.mon={...S.mon,...m};const v=S.mon,sys=+String(v.bp).split('/')[0];
 $('#mon').innerHTML=[['HR',v.hr,v.hr>130||v.hr<45],['BP',v.bp,sys<90],['SpO₂',v.spo2+'%',v.spo2<90],['RR',v.rr,v.rr>28],['RHYTHM',v.rhy,/AF|CHB/.test(v.rhy)]].map(([k,x,a])=>`<div class="${a?'al':''}"><small>${k}</small><b>${x}</b></div>`).join('')}
function score(){ $('#score').textContent=`${S.pts} / ${S.max} pts`}
function nav(){ $('#nav').innerHTML='';T.forEach((t,i)=>{const b=el('button',(i===S.tab?'on':'')+(done(t)?' done':''),t.nav);b.onclick=()=>go(i);$('#nav').append(b)})}
function done(t){const qs=t.b.filter(b=>b[0]==='q');return qs.length?qs.every(b=>S.ans[b[1].id]):!!S.seen[t.id]}
function go(i){S.tab=i;S.seen[T[i].id]=1;window.scrollTo(0,0);render()}
function say(who,text){const c=CAST[who];const d=el('div','say'+(who==='you'?' you':''));d.style.setProperty('--c',c[2]);d.innerHTML=`<div class="av">${c[3]}</div><div class="b"><span class="n">${c[0]} · ${c[1]}</span>${text}</div>`;return d}
function render(){const t=T[S.tab],m=$('#main');m.innerHTML='';$('#clock').textContent=t.clock;mon(t.mon);
 if(S.tab===0){m.append(el('div','cover',`<span class="mono">Valvular &amp; Structural Heart Unit · Case 01 · advanced postgraduate</span><h1>Severe aortic stenosis — <em>TAVI or SAVR?</em></h1><p>You are the day resident. One patient, six days, eight scenes. The monitor at the top is live: what you decide moves it. Nobody will tell you the answer before you commit.</p><div class="cast">${Object.values(CAST).slice(1).map(c=>`<div><b>${c[0]}</b>${c[1]}</div>`).join('')}</div>`))}
 let gated=false;
 for(const b of t.b){
  if(gated)break;
  const k=b[0];
  if(k==='slug')m.append(el('div','slug',b[1]));
  else if(k==='act')m.append(el('p','act',b[1]));
  else if(k==='say')m.append(say(b[1],b[2]));
  else if(k==='mon')mon(b[1]);
  else if(k==='html')m.append(el('div','',b[1]));
  else if(k==='card'){m.append(el('div','card '+(b[3]||''),`<h3>${b[1]}</h3>${b[2]}`))}
  else if(k==='reveal'){const r=el('div','rev'+(S.seen[t.id+b[1]]?' open':''),`<button>${b[1]}</button><div class="in">${b[2]}</div>`);r.firstChild.onclick=()=>{r.classList.toggle('open');S.seen[t.id+b[1]]=1};m.append(r)}
  else if(k==='q'){m.append(question(b[1]));const a=S.ans[b[1].id];if(a&&a.mon)mon(a.mon);if(!a){gated=true;m.append(el('div','gate','▼ Decide to continue the scene'))}}
 }
 if(t.id==='chart')fileTabs();
 if(t.id==='home')debrief();
 if(!gated&&S.tab<T.length-1){const n=el('div','next');const bt=el('button','btn',`Next: ${T[S.tab+1].nav} →`);bt.onclick=()=>go(S.tab+1);n.append(bt);m.append(n)}
 nav();score()}
function question(q){const a=S.ans[q.id],d=el('div','q');d.dataset.q=q.id;d.append(el('span','mono',q.multi?'Your call · select all that apply':'Your call'));d.append(el('h3','',q.ask));
 const order=q.opts.map((o,i)=>i).sort((x,y)=>((x*7+q.id.length*3)%q.opts.length)-((y*7+q.id.length*3)%q.opts.length));
 const sel=new Set();
 order.forEach(i=>{const o=q.opts[i],b=el('button','opt');b.dataset.v=o[1];b.innerHTML=o[0];
  if(a){b.disabled=true;if(q.multi){const picked=a.sel.includes(i),right=!!o[1];b.className='opt '+(right?(picked?'v2':'v1'):(picked?'v0':'dim'));b.innerHTML+=`<span class="tag">${right?(picked?'CAUGHT':'MISSED'):(picked?'NOT A PROBLEM':'RIGHTLY LEFT')}</span>${o[2]?`<span class="fb">${o[2]}</span>`:''}`}
   else{const mine=a.i===i;b.className='opt v'+o[1]+(mine?'':' dim');b.innerHTML+=`<span class="tag">${['HARM','DEFENSIBLE','BEST'][o[1]]}</span>${(mine||o[1]===2)?`<span class="fb">${o[2]}</span>`:''}`}}
  else b.onclick=()=>{if(q.multi){sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle('sel')}else{S.ans[q.id]={i,mon:o[3]};S.pts+=[0,5,10][o[1]];render()}};
  d.append(b)});
 if(q.multi&&!a){const s=el('button','btn','Commit');s.style.marginTop='8px';s.onclick=()=>{const arr=[...sel];S.ans[q.id]={sel:arr};S.pts+=q.opts.filter((o,i)=>!!o[1]===arr.includes(i)).length;render()};d.append(s)}
 return d}
function fileTabs(){const ks=Object.keys(FILE);let cur=S.fileTab||ks[0];const draw=()=>{$('#ctabs').innerHTML='';ks.forEach(k=>{const b=el('button',k===cur?'on':'',k);b.onclick=()=>{cur=S.fileTab=k;draw()};$('#ctabs').append(b)});$('#cbody').innerHTML='<div class="scroll">'+FILE[cur]+'</div>'};if($('#ctabs'))draw()}
function debrief(){const d=$('#debrief');if(!d)return;const pct=Math.round(S.pts/S.max*100);const harm=T.flatMap(t=>t.b).filter(b=>b[0]==='q'&&!b[1].multi&&S.ans[b[1].id]&&b[1].opts[S.ans[b[1].id].i][1]===0).length;
 d.innerHTML=`<div class="card ev"><span class="mono">Your shift</span><p class="big">${S.pts}<span class="mono"> / ${S.max} · ${pct}%</span></p><p>${harm?`<b>${harm} decision${harm>1?'s':''} would have harmed him.</b> Go back to those scenes — the monitor will show you why.`:'<b>No harmful decisions.</b> He walked because of calls like yours.'} ${pct>=85?'Consultant-grade reasoning.':pct>=65?'Solid registrar work — re-read the “defensible” answers.':'Replay the night of Day 3 until the reflex is automatic.'}</p></div>`}
render();
</script>
